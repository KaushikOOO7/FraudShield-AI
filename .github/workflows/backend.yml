name: Backend verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.4"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/constraints.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pip check
      - name: Acquire the original licensed dataset
        run: python scripts/download_sms_dataset.py
      - name: Fit the fixed baseline on real data
        run: python -m backend.app.ml.sms.train --dataset data/datasets/uci_sms_official.jsonl
      - run: python -m pytest backend/tests -q
      - run: python -m compileall -q backend/app scripts
